services:
  auth-db:
    image: postgres:16-alpine
    container_name: library-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${AUTH_DB_USER:-auth_user}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
      - ./services/auth/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-auth_user} -d ${AUTH_DB_NAME:-auth_db}"]
      interval: 5s
      timeout: 5s
      retries: 15

  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: library-auth-service
    restart: unless-stopped
    environment:
      PORT: 8000
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_USER: ${AUTH_DB_USER:-auth_user}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
      DB_NAME: ${AUTH_DB_NAME:-auth_db}
      JWT_SECRET: ${JWT_SECRET:-super-secret-library-jwt-key-change-in-prod}
    ports:
      - "8000:8000"
    depends_on:
      auth-db:
        condition: service_healthy

volumes:
  auth_pgdata:
    name: library_auth_data
